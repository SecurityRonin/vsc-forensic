[package]
name         = "vsc-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description  = "Reader for Windows Volume Shadow Copy (VSS) store/catalog structures"
keywords     = ["forensics", "windows", "vss", "shadowcopy", "dfir"]
categories   = ["parser-implementations", "filesystem"]
readme       = "../README.md"
exclude      = ["/fuzz", "/.github", "/docs"]

[lib]
name = "vsc"

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true }
# forensic-vfs (KNOWLEDGE leaf) — the read-only `ImageSource` positioned-read
# contract. Optional so a bare reader stays dependency-light; the `vfs` feature
# turns on the `impl ImageSource for VssSnapshotSource` adapter that publishes a
# reconstructed shadow copy as the `[H]` state-history byte source (mirrors
# apfs-core's and ntfs-core's `vfs` feature).
forensic-vfs = { version = "0.7", optional = true }

[features]
# Adapt a reconstructed VSS snapshot to the forensic-vfs `ImageSource` trait
# (see `src/vfs.rs`). NOTE: forensic-vfs declares `rust-version = "1.85"`, so
# this feature raises the effective MSRV above the crate's own 1.81; a
# default-features build still compiles on 1.81.
vfs = ["dep:forensic-vfs"]

[dev-dependencies]
# Tier-1 oracle: open a real E01 disk image to validate against pyvshadow
# ground truth (see tests/oracle_pcmus001.rs, env-gated on VSC_ORACLE_IMAGE).
ewf = "0.4"
# Tier-1 reconstruction oracle hashes each reconstructed block (RustCrypto).
sha2 = "0.10"

[lints]
workspace = true
