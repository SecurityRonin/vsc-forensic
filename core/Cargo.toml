[package]
name         = "vsc-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description  = "Reader for Windows Volume Shadow Copy (VSS) store/catalog structures"
keywords     = ["forensics", "windows", "vss", "shadowcopy", "dfir"]
categories   = ["parser-implementations", "filesystem"]
readme       = "../README.md"
exclude      = ["/fuzz", "/.github", "/docs"]

[lib]
name = "vsc"

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Tier-1 oracle: open a real E01 disk image to validate against pyvshadow
# ground truth (see tests/oracle_pcmus001.rs, env-gated on VSC_ORACLE_IMAGE).
ewf = "0.4"
# Tier-1 reconstruction oracle hashes each reconstructed block (RustCrypto).
sha2 = "0.10"

[lints]
workspace = true
